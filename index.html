    <!-- الثيم قبل أول رسم للصفحة: يمنع الوميض الأبيض -->
    <script>
      try {
        var t = localStorage.getItem('of_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0a0e1a' : '#f7f5f2');
      } catch (e) {}
    </script>
